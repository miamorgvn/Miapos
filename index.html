<script type="text/babel" data-presets="react">
// ===== TYPES & CONSTANTS =====
const ROLES = { OWNER:'Owner', MANAGER:'Manager', CASHIER:'Kasir', KITCHEN:'Dapur', WAITER:'Pelayan' };

const formatRupiah = (n) => 'Rp' + Math.round(n).toLocaleString('id-ID');
const formatNumber = (n, d=0) => n.toLocaleString('id-ID', { minimumFractionDigits:d, maximumFractionDigits:d });

const timeAgo = (iso) => {
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff/60000);
  if (min < 1) return 'Baru saja';
  if (min < 60) return min + ' menit lalu';
  const hr = Math.floor(min/60);
  if (hr < 24) return hr + ' jam lalu';
  return Math.floor(hr/24) + ' hari lalu';
};

// ===== ICON COMPONENT =====
// FIX KRITIS: dulu pakai <i data-lucide> + lucide.createIcons() yang MENGGANTI
// elemen <i> dengan <svg> di balik punggung React. Saat React mau update/unmount,
// node <i> sudah hilang -> "removeChild on Node: not a child" -> SELURUH APP
// CRASH & blank (root unmount). Sekarang React hanya merender <span> kosong,
// SVG lucide dibuat manual via lucide.createElement() -> tidak ada konflik DOM.
function Icon({ name, className = 'w-4 h-4' }) {
  var ref = React.useRef(null);
  React.useEffect(function() {
    var host = ref.current;
    if (!host) return;
    host.innerHTML = '';
    try {
      var L = window.lucide;
      if (!L || !L.icons || !L.createElement) return;
      var pascal = String(name).split('-').map(function(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }).join('');
      var node = L.icons[pascal] || L.icons[String(name)];
      if (!node) return;
      var svg = L.createElement(node);
      if (className) svg.setAttribute('class', className);
      svg.style.pointerEvents = 'none';
      host.appendChild(svg);
    } catch (e) {}
  }, [name, className]);
  return React.createElement('span', { ref: ref, className: 'inline-grid place-items-center', style: { lineHeight: 0 }, 'aria-hidden': 'true' });
}

function generateSeed() {
  const now = new Date().toISOString();
  const outlets = [
    { id:'outlet-1', name:'Cabang Paron', address:'Jl. Raya Paron', phone:'081234567890', active:true, createdAt:now },
  ];
  const employees = [
    { id:'emp-1', name:'Chelsa', email:'chelsa@miapos.id', pin:'1111', role:'CASHIER', active:true, outletId:'outlet-1', createdAt:now },
    { id:'emp-2', name:'Trinda', email:'trinda@miapos.id', pin:'2222', role:'CASHIER', active:true, outletId:'outlet-1', createdAt:now },
  ];
  const tables = [];
  ['outlet-1','outlet-2','outlet-3'].forEach((oid, i) => {
    const counts = [8, 4, 3];
    for (let j = 0; j < counts[i]; j++) {
      tables.push({ id: 'tbl-'+oid+'-'+(j+1), number:'T'+String(j+1).padStart(2,'0'), capacity:[2,4,4,6,8,2,4,4][j]||4, status:'AVAILABLE', outletId:oid, currentOrderId:undefined });
    }

  const baseMaterials = []; // Kosong — user tambah sendiri via Stok & Resep

  const matId = (oid, name) => materials.find(m => m.outletId===oid && m.name===name)?.id;
  const productSeeds = [
    { name:'Nasi Goreng Spesial', category:'FOOD', price:32000, cost:11000, recipe:[] },

    { name:'Kopi Hitam', category:'BEVERAGE', price:12000, cost:4000, recipe:[] },
    { name:'Pisang Goreng', category:'SNACK', price:15000, cost:5000, recipe:[] },

  const products = [];

    const pid = 'prod-'+o.id+'-'+(idx+1);
    products.push({
      id:pid, outletId:o.id, name:p.name, category:p.category, price:p.price, cost:p.cost, available:true,

      recipeItems: p.recipe.map(r => ({ materialId: matId(o.id, r.m), quantity: r.q })),
      createdAt: now,

  const orders = [];
  return {
    outlets, employees, tables, products, materials, orders, movements: [],
    settings: { taxRate: 0, outletId:'outlet-1', cashierId:'emp-1', online:true, fiturHPP:false, theme:'emerald', morningNotif:true, ...NOTIF_DEFAULTS },

// Rollover otomatis: pesanan yang bukan hari ini dipindah ke archivedOrders.
// Dipanggil saat load + tiap 30 detik + saat tab kembali aktif, jadi pesanan
// kemarin otomatis "hilang" dari daftar aktif tanpa perlu buka-tutup app.
function applyRollover(state) {
  const today = new Date().toISOString().slice(0, 10);
  if (state.lastArchiveDate === today) return state;
  const stillToday = state.orders.filter(o => (o.createdAt || '').slice(0, 10) === today);
  const toArchive = state.orders.filter(o => (o.createdAt || '').slice(0, 10) !== today);
  const next = { ...state, orders: stillToday, lastArchiveDate: today };
  if (toArchive.length > 0) {
    next.archivedOrders = [...(state.archivedOrders || []), ...toArchive];
    console.log('Miapos: Auto-arsip', toArchive.length, 'pesanan hari sebelumnya');
  }
  return next;
}

function AppProvider({ children }) {
  const [state, setState] = React.useState(() => {
    let loaded;
    try { const s = localStorage.getItem(STORAGE_KEY); if (s) loaded = JSON.parse(s); } catch(e) {}
    if (!loaded) {
      // Migrasi dari v3: ambil menu/outlet/kasir/meja milik user,
      // tapi KOSONGKAN semua angka (pesanan, omzet, arsip, pergerakan stok)
      try {
        const legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY) || 'null');
        if (legacy && Array.isArray(legacy.products)) {
          loaded = {
            outlets: legacy.outlets || [], employees: legacy.employees || [],
            tables: legacy.tables || [], products: legacy.products,
            materials: legacy.materials || [], movements: [],
            orders: [], archivedOrders: [],
            settings: legacy.settings || { taxRate: 0, outletId:'outlet-1', cashierId:'emp-1', online:true, fiturHPP:false },
          };
        }
      } catch(e) {}
    }
    if (!loaded) loaded = generateSeed();
    // Normalisasi settings: field baru (mis. theme) dapat default aman utk data lama
    loaded.settings = Object.assign({ taxRate:0, outletId:'outlet-1', cashierId:'emp-1', online:true, fiturHPP:false, theme:'emerald', morningNotif:true }, NOTIF_DEFAULTS, loaded.settings || {});
    if (MD_THEME_KEYS.indexOf(loaded.settings.theme) === -1) loaded.settings.theme = 'emerald';
    loaded.archivedOrders = loaded.archivedOrders || [];
    return applyRollover(loaded);
  });
  const [cart, setCart] = React.useState([]);
  const [cartTableId, setCartTableId] = React.useState(undefined);
  const [cartOrderType, setCartOrderType] = React.useState('DINE_IN');

  React.useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }, [state]);

  // v2.7 CLOUD AUTO-BACKUP: tiap data berubah & online, snapshot dikirim ke
  // /api/backup (Vercel) → tersimpan ke folder backups/ di repo GitHub.
  // TANPA Termux, tanpa jaga server, tanpa nguras batre — kerja beratnya di cloud.
  // Aturan main: maksimal 1x per 2 jam, dan cuma kalau datanya beneran berubah.
  React.useEffect(() => {
    try {
      var online = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (!online) return;
      var key = localStorage.getItem('miapos-cloud-key') || '';
      if (!key) return;
      var s = JSON.stringify(state);
      var h = 0;
      for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
      var last = parseInt(localStorage.getItem('miapos-cloud-last') || '0', 10) || 0;
      var lastH = localStorage.getItem('miapos-cloud-hash') || '';
      if (String(h) === lastH) return; // data belum berubah sejak backup terakhir
      if (Date.now() - last < 2 * 60 * 60 * 1000) return; // throttle: 1x per 2 jam
      var t = setTimeout(function() {
        fetch('/api/backup', { method:'POST', headers:{ 'Content-Type':'application/json', 'x-backup-key': key }, body: s })
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(res) {
            if (res && res.ok) {
              try {
                localStorage.setItem('miapos-cloud-last', String(Date.now()));
                localStorage.setItem('miapos-cloud-hash', String(h));
              } catch (e) {}
              console.log('Miapos: backup cloud tersimpan (' + res.file + ')');
            }
          })
          .catch(function() {});
      }, 15000);
      return function() { clearTimeout(t); };
    } catch (e) {}
  }, [state]);

  // Rollover LIVE: cek pergantian hari tiap 30 detik + saat tab kembali aktif
  React.useEffect(() => {
    function checkDay() {
      const today = new Date().toISOString().slice(0, 10);
      setState(s => s.lastArchiveDate === today ? s : applyRollover(s));
    }
    var iv = setInterval(checkDay, 30000);
    var onVis = function() { if (document.visibilityState === 'visible') checkDay(); };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('focus', onVis);
    return function() { clearInterval(iv); document.removeEventListener('visibilitychange', onVis); window.removeEventListener('focus', onVis); };
  }, []);

  const bcRef = React.useRef(null);
  React.useEffect(() => {
    if (typeof BroadcastChannel === 'undefined') return;
    const bc = new BroadcastChannel('miapos-sync');
    bcRef.current = bc;
    bc.onmessage = (e) => {
      if (e.data?.type === 'ORDER_NEW' && e.data.outletId === state.settings.outletId) {
        setState(s => {
          if (s.orders.some(o => o.id === e.data.payload.id)) return s;
          const order = e.data.payload;
          const newMaterials = [...s.materials];
          order.items.forEach(it => {
            const p = s.products.find(pp => pp.id === it.productId);
            if (!p) return;
            p.recipeItems.forEach(r => {
              const idx = newMaterials.findIndex(m => m.id === r.materialId);
              if (idx >= 0) newMaterials[idx] = { ...newMaterials[idx], stock: Math.max(0, newMaterials[idx].stock - r.quantity * it.quantity) };
            });
          });
          const tables = order.tableId ? s.tables.map(t => t.id === order.tableId ? { ...t, status:'OCCUPIED', currentOrderId: order.id } : t) : s.tables;
          return { ...s, orders: [...s.orders, order], materials: newMaterials, tables };
        });
      }
    };
    return () => bc.close();
  }, [state.settings.outletId]);

  const api = React.useMemo(() => ({
    state, cart, cartTableId, cartOrderType,
    setOutlet: (outletId) => { setState(s => ({ ...s, settings: { ...s.settings, outletId } })); setCart([]); setCartTableId(undefined); },
    setCashier: (cashierId) => setState(s => ({ ...s, settings: { ...s.settings, cashierId } })),
    toggleOnline: () => setState(s => ({ ...s, settings: { ...s.settings, online: !s.settings.online } })),
    toggleHPP: () => setState(s => ({ ...s, settings: { ...s.settings, fiturHPP: !s.settings.fiturHPP } })),
    // v2.8: saklar notifikasi salam pagi (default ON)
    toggleMorningNotif: () => setState(s => ({ ...s, settings: { ...s.settings, morningNotif: !(s.settings.morningNotif !== false) } })),
    // v2.9: setter umum utk Owner Zone (jam buka/tutup, teks notif, nama pengirim, dll)
    updateSettings: (patch) => setState(s => ({ ...s, settings: { ...s.settings, ...(patch || {}) } })),
    setTheme: (t) => setState(s => (MD_THEME_KEYS.indexOf(t) === -1 || t === s.settings.theme) ? s : ({ ...s, settings: { ...s.settings, theme: t } })),
    addToCart: (productId, variantId) => {
      const p = state.products.find(x => x.id === productId); if (!p) return;
      const v = variantId ? p.variants.find(x => x.id === variantId) : undefined;
      const unit = p.price + (v?.priceMod || 0);
      setCart(prev => {
        const ex = prev.find(c => c.productId === productId && c.variantId === variantId && !c.notes);
        if (ex) return prev.map(c => c.id === ex.id ? { ...c, quantity: c.quantity+1, subtotal:(c.quantity+1)*c.unitPrice } : c);
        return [...prev, { id:uid(), productId, productName:p.name, variantId:v?.id, variantName:v?.name, variantPriceMod:v?.priceMod||0, quantity:1, unitPrice:unit, subtotal:unit, notes:'' }];
      });
    },
    updateCartQty: (id, qty) => setCart(prev => prev.map(c => c.id===id ? { ...c, quantity:qty, subtotal:qty*c.unitPrice } : c).filter(c => c.quantity > 0)),
    updateCartItemNotes: (id, notes) => setCart(prev => prev.map(c => c.id===id ? { ...c, notes } : c)),
    removeFromCart: (id) => setCart(prev => prev.filter(c => c.id !== id)),
    setCartTable: (id) => setCartTableId(id),
    setCartOrderType: (t) => setCartOrderType(t),
    clearCart: () => { setCart([]); setCartTableId(undefined); setCartOrderType('DINE_IN'); },
    checkout: ({ method, paid, discount=0, customerName='', notes='', tempat='' }) => {
      if (cart.length === 0) return null;
      const outletId = state.settings.outletId;
      const cashier = state.employees.find(e => e.id === state.settings.cashierId);
      const table = cartTableId ? state.tables.find(t => t.id === cartTableId) : undefined;
      const subtotal = cart.reduce((s,c) => s+c.subtotal, 0);

      const total = Math.max(0, subtotal - discount);
      const change = Math.max(0, paid - total);
      const number = 2000 + state.orders.filter(o => o.outletId === outletId).length + 1;
      const queueNumber = getNextQueueNumber();
      const nowIso = new Date().toISOString();
      const order = {
        id:uid(), number, type:cartOrderType, status:'PENDING', paymentStatus:'PAID', paymentMethod:method,
        subtotal, discount, tax:0, serviceCharge:0, total, paid, change,
        tableId:table?.id, tableNumber:(tempat || table?.number), cashierId:cashier?.id, cashierName:cashier?.name, outletId,
        customerName: customerName || '', notes: notes || '', queueNumber,
        items: cart.map(c => ({ id:uid()+'-'+Math.random().toString(36).slice(2,5), productId:c.productId, productName:c.productName, variantId:c.variantId, variantName:c.variantName, quantity:c.quantity, price:c.unitPrice, notes:c.notes||'', status:'PENDING', createdAt:nowIso })),
        createdAt:nowIso, updatedAt:nowIso, paidAt:nowIso,
      };
      const newMaterials = [...state.materials];
      const newMovements = [...state.movements];
      order.items.forEach(it => {
        const p = state.products.find(pp => pp.id === it.productId);
        if (!p) return;
        p.recipeItems.forEach(r => {
          const idx = newMaterials.findIndex(m => m.id === r.materialId);
          if (idx < 0) return;
          const consumed = r.quantity * it.quantity;
          newMaterials[idx] = { ...newMaterials[idx], stock: Math.max(0, newMaterials[idx].stock - consumed) };
          newMovements.push({ id:uid(), materialId:r.materialId, materialName:newMaterials[idx].name, quantity:-consumed, reason:'SALE', refOrderId:order.id, createdAt:nowIso });
        });
      });
      const tables = table ? state.tables.map(t => t.id === table.id ? { ...t, status:'OCCUPIED', currentOrderId:order.id } : t) : state.tables;
      setState(s => ({ ...s, orders:[...s.orders, order], materials:newMaterials, movements:newMovements, tables }));
      setCart([]); setCartTableId(undefined); setCartOrderType('DINE_IN');
      if (bcRef.current) bcRef.current.postMessage({ type:'ORDER_NEW', outletId:order.outletId, payload:order });
      return order;
    },
    saveUnpaidOrder: ({ discount=0, customerName='', notes='', tempat='' }) => {
      if (cart.length === 0) return null;
      const outletId = state.settings.outletId;
      const cashier = state.employees.find(e => e.id === state.settings.cashierId);
      const table = cartTableId ? state.tables.find(t => t.id === cartTableId) : undefined;
      const subtotal = cart.reduce((s,c) => s+c.subtotal, 0);

      const total = Math.max(0, subtotal - discount);
      const number = 2000 + state.orders.filter(o => o.outletId === outletId).length + 1;
      const queueNumber = getNextQueueNumber();
      const nowIso = new Date().toISOString();
      const order = {
        id:uid(), number, type:cartOrderType, status:'PENDING', paymentStatus:'UNPAID',
        subtotal, discount, tax:0, serviceCharge:0, total, paid:0, change:0,
        tableId:table?.id, tableNumber:(tempat || table?.number), cashierId:cashier?.id, cashierName:cashier?.name, outletId,
        customerName: customerName || '', notes: notes || '', queueNumber,
        items: cart.map(c => ({ id:uid()+'-'+Math.random().toString(36).slice(2,5), productId:c.productId, productName:c.productName, variantId:c.variantId, variantName:c.variantName, quantity:c.quantity, price:c.unitPrice, notes:c.notes||'', status:'PENDING', createdAt:nowIso })),
        createdAt:nowIso, updatedAt:nowIso,
      };
      // Tetap potong bahan baku karena pesanan sudah dibuat
      const newMaterials = [...state.materials];
      const newMovements = [...state.movements];
      order.items.forEach(it => {
        const p = state.products.find(pp => pp.id === it.productId);
        if (!p) return;
        p.recipeItems.forEach(r => {
          const idx = newMaterials.findIndex(m => m.id === r.materialId);
          if (idx < 0) return;
          const consumed = r.quantity * it.quantity;
          newMaterials[idx] = { ...newMaterials[idx], stock: Math.max(0, newMaterials[idx].stock - consumed) };
          newMovements.push({ id:uid(), materialId:r.materialId, materialName:newMaterials[idx].name, quantity:-consumed, reason:'SALE', refOrderId:order.id, createdAt:nowIso });
        });
      });
      const tables = table ? state.tables.map(t => t.id === table.id ? { ...t, status:'OCCUPIED', currentOrderId:order.id } : t) : state.tables;
      setState(s => ({ ...s, orders:[...s.orders, order], materials:newMaterials, movements:newMovements, tables }));
      setCart([]); setCartTableId(undefined); setCartOrderType('DINE_IN');
      if (bcRef.current) bcRef.current.postMessage({ type:'ORDER_NEW', outletId:order.outletId, payload:order });
      return order;
    },
    cancelOrder: (orderId) => setState(s => ({
      ...s,
      orders: s.orders.map(o => o.id === orderId ? { ...o, status:'CANCELLED', updatedAt:new Date().toISOString() } : o),
      tables: s.tables.map(t => t.currentOrderId === orderId ? { ...t, status:'DIRTY', currentOrderId:undefined } : t),
    })),
    markOrderPaid: (orderId, method, paid) => setState(s => {
      const order = s.orders.find(o => o.id === orderId);
      if (!order) return s;
      const change = Math.max(0, paid - order.total);
      const orders = s.orders.map(o => o.id===orderId ? { ...o, paymentStatus:'PAID', paymentMethod:method, paid, change, status:'PAID', paidAt:new Date().toISOString(), updatedAt:new Date().toISOString() } : o);
      const tables = s.tables.map(t => t.currentOrderId === orderId ? { ...t, status:'DIRTY', currentOrderId:undefined } : t);
      return { ...s, orders, tables };
    }),
    // Edit order items (add, change qty, remove, recalculate total)
    addOrderItem: (orderId, product, variant) => setState(s => {
      const orders = s.orders.map(o => {
        if (o.id !== orderId) return o;
        const unit = product.price + (variant?.priceMod || 0);
        const newItem = { id: uid(), productId: product.id, productName: product.name, variantId: variant?.id, variantName: variant?.name, quantity: 1, price: unit, notes: '', status: 'PENDING', createdAt: new Date().toISOString() };
        const items = [...o.items, newItem];
        const subtotal = items.reduce((sum, it) => sum + it.quantity * it.price, 0);
        const total = Math.max(0, subtotal - (o.discount || 0));
        return { ...o, items, subtotal, total, updatedAt: new Date().toISOString() };
      });
      return { ...s, orders };
    }),
    updateOrderItemQty: (orderId, itemId, qty) => setState(s => {
      const orders = s.orders.map(o => {
        if (o.id !== orderId) return o;
        const items = qty > 0 ? o.items.map(it => it.id === itemId ? { ...it, quantity: qty } : it) : o.items.filter(it => it.id !== itemId);

var WX_KEY = 'miapos-wx';
var WX_GEO_KEY = 'miapos-wx-geo';
var WX_FRESH = 30 * 60 * 1000; // 30 menit
var WX_CODES = {

  3:{ l:'Berawan', e:'☁️' }, 45:{ l:'Berkabut', e:'🌫️' }, 48:{ l:'Berkabut Beku', e:'🌫️' },
  51:{ l:'Gerimis', e:'🌦️' }, 53:{ l:'Gerimis', e:'🌦️' }, 55:{ l:'Gerimis Lebat', e:'🌦️' },
  61:{ l:'Hujan Ringan', e:'🌧️' }, 63:{ l:'Hujan', e:'🌧️' }, 65:{ l:'Hujan Lebat', e:'🌧️' },
  66:{ l:'Hujan Beku', e:'🌧️' }, 67:{ l:'Hujan Beku', e:'🌧️' },
  71:{ l:'Salju', e:'🌨️' }, 73:{ l:'Salju', e:'🌨️' }, 75:{ l:'Salju Tebal', e:'❄️' }, 77:{ l:'Butiran Salju', e:'🌨️' },
  80:{ l:'Hujan Deras', e:'🌧️' }, 81:{ l:'Hujan Deras', e:'🌧️' }, 82:{ l:'Hujan Sangat Deras', e:'⛈️' },
  85:{ l:'Gerimis Salju', e:'🌨️' }, 86:{ l:'Gerimis Salju', e:'🌨️' },
  95:{ l:'Badai Petir', e:'⛈️' }, 96:{ l:'Badai Petir + Es', e:'⛈️' }, 99:{ l:'Badai Petir + Es', e:'⛈️' }
};
function wxMap(code) { return WX_CODES[code] || { l:'Cuaca', e:'☁️' }; }
function wxReadCache() { try { return JSON.parse(localStorage.getItem(WX_KEY) || 'null'); } catch (e) { return null; } }
function wxGetGeo() { try { return JSON.parse(localStorage.getItem(WX_GEO_KEY) || 'null'); } catch (e) { return null; } }
function wxAskGeo() {
  return new Promise(function(resolve) {
    try {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        function(p) {
          var g = { lat: Math.round(p.coords.latitude * 100) / 100, lon: Math.round(p.coords.longitude * 100) / 100 };
          try { localStorage.setItem(WX_GEO_KEY, JSON.stringify(g)); } catch (e) {}
          resolve(g);
        },
        function() { resolve(null); },
        { timeout: 8000, maximumAge: 6 * 60 * 60 * 1000 }
      );
    } catch (e) { resolve(null); }
  });
}
function wxFetch(force) {
  return new Promise(function(resolve) {
    var cached = wxReadCache();
    if (!force && cached && cached.ok && Date.now() - (cached.at || 0) < WX_FRESH) return resolve(cached);
    function ambil(g) {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + g.lat + '&longitude=' + g.lon +
        '&current=temperature_2m,relative_humidity_2m,weather_code&timezone=auto';
      fetch(url)
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(j) {
          if (!j || !j.current) return resolve(cached || null);
          var d = {
            ok: true,
            temp: Math.round(j.current.temperature_2m),
            hum: j.current.relative_humidity_2m != null ? Math.round(j.current.relative_humidity_2m) : null,
            code: j.current.weather_code || 0,
            at: Date.now(),
            approx: !g.own
          };
          try { localStorage.setItem(WX_KEY, JSON.stringify(d)); } catch (e) {}
          resolve(d);
        })
        .catch(function() { resolve(cached || null); });
    }
    var geo = wxGetGeo();
    if (geo) { geo.own = true; return ambil(geo); }
    wxAskGeo().then(function(g) {
      if (g) { g.own = true; ambil(g); }
      else ambil({ lat: -6.2088, lon: 106.8456, own: false }); // default: Jakarta, bila lokasi ditolak/tidak ada
    });
  });
}
// Salam sesuai jam — dipakai kartu cuaca & notifikasi pagi
function greetParts(h) {
  if (h >= 4 && h <= 10) return { label:'Selamat pagi', emoji:'☀️', sub:'Saatnya buka lapak, semangat ya!' };
  if (h <= 14) return { label:'Selamat siang', emoji:'🌞', sub:'Semangat jaga antrian & omzetnya!' };
  if (h <= 17) return { label:'Selamat sore', emoji:'🌇', sub:'Sikat orderan sorenya!' };
  return { label:'Selamat malam', emoji:'🌙', sub:'Rehat dulu, data aman semua.' };
}
// ===== v2.8→v2.9: NOTIFIKASI BUKA & TUTUP RESTO (notifikasi sistem beneran) =====
// • Notif BUKA  : muncul jam buka (default 08.00)  → isi: "morgvn: Selamat pagi, ..."
// • Notif TUTUP : muncul jam tutup (default 21.00) → isi: "morgvn: Sudah jam 9 malam, ..."
//                 + GETAR PENDEK (bentar aja, gak lama)
// • Jam & teksnya diatur owner di Owner Zone (Pengaturan → Owner Zone, pakai password)
// • Jadwal jalan selama app Miapos jalan di HP (dibuka / di background), cek tiap 20 detik,
//   maksimal 1x per hari per jenis — gak nyerang terus. Data dibaca langsung dari localStorage
//   tiap tick, jadi perubahan di Owner Zone langsung kepakai tanpa buka-ulang app.
var Notif = {
  perm: function() { try { return ('Notification' in window) ? Notification.permission : 'unsupported'; } catch (e) { return 'unsupported'; } },
  fire: function(title, body, tag, vibrate) {
    try {
      if (!('Notification' in window) || Notification.permission !== 'granted') return false;
      var opts = { body: body, tag: tag || 'miapos', icon: './icon-192.png', badge: './icon-192.png', vibrate: vibrate || [80, 40, 80], dir: 'id' };
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
        navigator.serviceWorker.getRegistration().then(function(reg) {
          if (reg && reg.showNotification) { try { reg.showNotification(title, opts); } catch (e) {} }
          else { try { new Notification(title, opts); } catch (e) {} }
        }).catch(function() { try { new Notification(title, opts); } catch (e) {} });
      } else { try { new Notification(title, opts); } catch (e) {} }
      return true;
    } catch (e) { return false; }
  },
  // ---- v2.9: mesin jadwal ----
  readSettings: function() {
    try { var raw = JSON.parse(localStorage.getItem('miapos-store-v4') || 'null'); return (raw && raw.settings) || {}; } catch (e) { return {}; }
  },
  todayKey: function() {
    var d = new Date(); var p = function(n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  },
  parseHM: function(hm) {
    var a = String(hm || '').split(':'); var h = parseInt(a[0], 10) || 0; var m = parseInt(a[1], 10) || 0;
    return h * 60 + m;
  },
  // Kirim notif dari owner — format isi: "<nama owner>: <teks ucapan>"
  sendOwner: function(kind, s) {
    s = s || this.readSettings();
    var owner = String(s.notifOwnerName || 'morgvn').trim() || 'morgvn';
    var text = kind === 'buka' ? (s.notifMorningText || NOTIF_DEFAULTS.notifMorningText) : (s.notifNightText || NOTIF_DEFAULTS.notifNightText);
    var title = kind === 'buka' ? '☀️ Miapos · Buka Resto' : '🌙 Miapos · Waktunya Tutup';
    // notif tutup = getar PENDEK (bentar aja); kalau dimatikan owner → getar super halus
    var vib = kind === 'tutup' ? (s.notifNightVibrate === false ? [60, 40, 60] : [220, 130, 220]) : [80, 40, 80];
    return this.fire(title, owner + ': ' + text, 'miapos-' + kind, vib);
  },
  // Dipanggil tiap ±20 detik + tiap app dibuka/kembali aktif.
  tick: function() {
    try {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      var s = this.readSettings();
      if (s.morningNotif === false) return; // saklar utama di Pengaturan
      var now = new Date();
      var cur = now.getHours() * 60 + now.getMinutes();
      var dkey = this.todayKey();
      var openM = this.parseHM(s.notifOpenTime || '08:00');
      var closeM = this.parseHM(s.notifCloseTime || '21:00');
      // jendela 60 menit: app baru dibuka agak telat tetap kejar notifnya (maks 1x/hari)
      if (cur >= openM && cur - openM <= 60 && (localStorage.getItem('miapos-notif-buka') || '') !== dkey) {
        localStorage.setItem('miapos-notif-buka', dkey);
        this.sendOwner('buka', s);
        return;
      }
      if (cur >= closeM && cur - closeM <= 60 && (localStorage.getItem('miapos-notif-tutup') || '') !== dkey) {
        localStorage.setItem('miapos-notif-tutup', dkey);
        this.sendOwner('tutup', s);
      }
    } catch (e) {}
  },
  // nama lama yang dipakai beberapa tempat — sekarang delegasi ke mesin jadwal v2.9
  maybeMorning: function() { return this.tick(); }
};

const KpiCard = ({ label, value, sub, icon, color }) => {
  const grads = {
    blue:'from-emerald-500 via-emerald-500 to-emerald-600 shadow-emerald-500/30',
    amber:'from-amber-500 to-orange-600 shadow-amber-500/30',
    red:'from-red-500 to-rose-600 shadow-red-500/30',
    violet:'from-violet-500 to-purple-600 shadow-violet-500/30'
  };
  // Count-up: parse angka dari string nilai (mis. 'Rp32.000' -> 32000)
  const raw = React.useMemo(() => {
    const s = String(value);
    const isRp = s.indexOf('Rp') === 0;
    const num = parseFloat(s.replace(/[^0-9.,-]/g, '').replace(/\./g, '').replace(',', '.'));
    if (!isFinite(num)) return null;
    return { num, isRp };
  }, [value]);
  const [disp, setDisp] = React.useState(raw ? raw.num : 0);
  const fromRef = React.useRef(0);
  React.useEffect(() => {
    if (!raw) return;
    const target = raw.num;
    const startVal = fromRef.current;
    const t0 = performance.now();
    const dur = 850;
    let raf;
    function tick(t) {
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      setDisp(startVal + (target - startVal) * e);
      if (p < 1) { raf = requestAnimationFrame(tick); } else { fromRef.current = target; }
    }
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [raw ? raw.num : 0]);
  const shown = raw ? (raw.isRp ? formatRupiah(disp) : formatNumber(Math.round(disp))) : value;
  return React.createElement(Card, { className:'overflow-hidden relative animate-mp-pop' },
    React.createElement('div', { className:'p-3 md:p-5' },
      React.createElement('div', { className:'flex items-start justify-between gap-2 pb-2' },
        React.createElement('span', { className:'text-[10px] md:text-xs font-semibold text-slate-500 leading-tight' }, label),
        React.createElement('span', { className: cn('grid h-8 w-8 md:h-9 md:w-9 shrink-0 place-items-center rounded-xl bg-gradient-to-br text-white shadow-lg', grads[color] || grads.blue) },
          React.createElement(Icon, { name: icon, className:'w-4 h-4' })
        )
      ),
      React.createElement('div', { className:'text-base md:text-2xl font-extrabold tracking-tight' }, shown),
      React.createElement('p', { className:'text-[10px] md:text-xs text-slate-500 mt-1' }, sub)
    )
  );
};

const PieChartSimple = ({ data }) => {
  if (!data || data.length === 0) return React.createElement('div', { className:'h-[200px] grid place-items-center text-slate-400 text-sm' }, 'No data');
  const colors = [themeMainHex(),'#f59e0b',themeMainHex(),'#8b5cf6','#06b6d4','#ec4899'];
  const total = data.reduce((s,d) => s + d.value, 0);
  let cum = 0;
  return React.createElement('div', { className:'flex flex-col items-center' },
    React.createElement('svg', { viewBox: '0 0 100 100', className: 'w-32 h-32 animate-mp-fade-scale' },
      data.map((d, i) => {

// ===== BLUETOOTH PRINTER =====
const PRINTER_STORAGE_KEY = 'miapos-printers';

function getPrinters() {
  try { return JSON.parse(localStorage.getItem(PRINTER_STORAGE_KEY) || '{}'); } catch(e) { return {}; }
}
function setPrinter(type, device) {
  const printers = getPrinters();
  if (device) {
    printers[type] = { id: device.id, name: device.name, savedAt: new Date().toISOString() };
  } else {
    delete printers[type];
  }
  localStorage.setItem(PRINTER_STORAGE_KEY, JSON.stringify(printers));
}

async function connectPrinter(type) {
  if (!navigator.bluetooth) {
    alert('Browser tidak mendukung Web Bluetooth. Gunakan Chrome/Edge di Android atau desktop.\n\nPastikan HTTPS aktif.');
    return null;
  }
  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '00001101-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455']
    });
    setPrinter(type, { id: device.id, name: device.name || 'Printer ' + type });
    _printerDeviceCache[type] = device; // Cache untuk auto-print
    return device;
  } catch (e) {
    if (e.name !== 'NotFoundError') {
      alert('Gagal pilih printer: ' + e.message);
    }
    return null;
  }
}

async function printText(device, text) {
  try {
    const server = await device.gatt.connect();
    // Coba beberapa service umum untuk printer thermal Bluetooth
    const services = ['000018f0-0000-1000-8000-00805f9b34fb', '00001101-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455'];
    let characteristic = null;
    for (const svc of services) {
      try {
        const service = await server.getPrimaryService(svc);
        const chars = await service.getCharacteristics();
        if (chars && chars.length > 0) {
          // Cari characteristic yang bisa write
          characteristic = chars.find(c => c.properties.write || c.properties.writeWithoutResponse) || chars[0];
          break;
        }
      } catch (e) { /* try next */ }
    }
    if (!characteristic) throw new Error('Tidak ada characteristic print yang ditemukan');

    const encoder = new TextEncoder();
    const data = encoder.encode(text);
    // ESC/POS init + print
    const init = new Uint8Array([0x1B, 0x40]); // ESC @ = init printer
    const cut = new Uint8Array([0x1D, 0x56, 0x00]); // GS V 0 = cut paper

    const fullData = new Uint8Array(init.length + data.length + cut.length);
    fullData.set(init, 0);
    fullData.set(data, init.length);
    fullData.set(cut, init.length + data.length);

    // Split menjadi chunk 100 bytes (printer Bluetooth biasanya limit)
    const chunkSize = 100;
    for (let i = 0; i < fullData.length; i += chunkSize) {
      const chunk = fullData.slice(i, i + chunkSize);
      if (characteristic.properties.writeWithoutResponse) {
        await characteristic.writeValueWithoutResponse(chunk);
      } else {
        await characteristic.writeValueWithResponse(chunk);
      }
    }
    return true;
  } catch (e) {
    throw new Error('Print gagal: ' + e.message);
  }
}

// ===== ORDER TYPE LABELS (Mengikuti Waroeng Semilir) =====
const ORDER_TYPE_LABELS = {
  DINE_IN: 'Makan Ditempat',
  TAKEAWAY: 'Bawa Pulang',
};

// ===== LABEL METODE PEMBAYARAN =====
const PAY_METHOD_LABELS = { CASH:'Tunai', QRIS:'QRIS', TRANSFER:'Transfer Bank', EWALLET:'E-Wallet' };
const payMethodLabel = (m) => PAY_METHOD_LABELS[m] || m || '-';

function formatReceiptESCPOS(receipt, type) {
  const lines = [];
  const W = 32; // 58mm printer ~32 chars
  const center = (s) => { const p = Math.max(0, (W - s.length) / 2); return ' '.repeat(Math.floor(p)) + s; };
  const pad = (l, r, w = W) => { const total = w - l.length - r.length; return l + ' '.repeat(Math.max(1, total)) + r; };
  const padLeft = (l, r, w = W) => { if (l.length + r.length < w) return l + ' '.repeat(w - l.length - r.length) + r; if (l.length + r.length > w) { r = r.slice(0, Math.max(0, w - l.length - 1)); return l + ' '.repeat(1) + r; } return l + ' ' + r; };

  const resto = getRestoInfo();
  const waktu = new Date(receipt.createdAt || Date.now()).toLocaleString('id-ID', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });

  // === HEADER (BEDA: nota kasir = info resto; nota dapur = bersih tanpa info resto) ===
  if (type === 'dapur') {
    lines.push(center('DAPUR'));
  } else {
    lines.push(center(resto.name || 'waroeng semilirr'));
    // Alamat & telepon HANYA di nota kasir
    if (resto.address) {
      const addrLines = resto.address.match(new RegExp('.{1,' + (W-2) + '}', 'g')) || [];
      addrLines.forEach(l => lines.push(center(l.trim())));
    }
    if (resto.phone) lines.push(center(resto.phone));
  }
  lines.push('='.repeat(W));

  // === DETAIL TRANSAKSI ===
  const orderNo = receipt.number ? 'ORD' + String(receipt.number).padStart(9, '0').slice(-9) : 'ORD' + String(Date.now()).slice(-9);
  lines.push(padLeft('No. Pesanan', orderNo));
  lines.push(padLeft('Waktu', waktu));
  if (receipt.customerName) lines.push(padLeft('Pelanggan', receipt.customerName));
  lines.push(padLeft('Kasir', receipt.cashierName || '-'));
  lines.push(padLeft('Jenis Pesanan', ORDER_TYPE_LABELS[receipt.orderType] || receipt.orderType || '-'));
  if (receipt.tempat || receipt.tableNumber) {
    lines.push(padLeft('Tempat', receipt.tempat || receipt.tableNumber));
  }
  if (type === 'dapur' && receipt.notes) {
    lines.push(padLeft('Catatan', receipt.notes.slice(0, W-12)));
  }
  lines.push('-'.repeat(W));

  // === ITEM PESANAN ===
  if (type === 'dapur') {
    // Nota dapur: qty + nama, no harga, pakai UPPERCASE
    receipt.items.forEach(it => {
      const baseName = (it.name || '').split(' (')[0];
      lines.push((it.qty + ' ' + baseName).toUpperCase());
      if (it.notes) lines.push('  cat: ' + it.notes);
    });
  } else {
    // Nota kasir: nama di baris pertama, qty + harga di baris kedua
    receipt.items.forEach(it => {
      const baseName = (it.name || '').split(' (')[0];
      const variant = it.variantName ? ' ' + it.variantName : '';
      lines.push(baseName + variant);
      const qty = it.qty;
      const priceText = qty + ' x ' + formatRupiah(it.price).replace('Rp', '');
      const subtotal = formatRupiah(qty * it.price).replace('Rp', '');
      lines.push(padLeft(priceText, subtotal));
      if (it.notes) lines.push('  catatan: ' + it.notes);
    });
  }

  // === FOOTER (kasir saja, dapur cukup No. Antrian) ===
  if (type !== 'dapur') {
    lines.push('-'.repeat(W));
    const subtotalCalc = receipt.items.reduce((s, it) => s + it.qty * it.price, 0);
    lines.push(padLeft('Subtotal', formatRupiah(subtotalCalc).replace('Rp', '')));
    if (receipt.discount && receipt.discount > 0) lines.push(padLeft('Diskon', '-' + formatRupiah(receipt.discount).replace('Rp', '')));
    lines.push(padLeft('Total', formatRupiah(receipt.total).replace('Rp', '')));
    lines.push('');
    lines.push(padLeft('Pembayaran', payMethodLabel(receipt.method)));
    lines.push(padLeft('Jumlah Dibayarkan', formatRupiah(receipt.paid).replace('Rp', '')));
    lines.push(padLeft('Kembali', formatRupiah(receipt.change).replace('Rp', '')));
  }

  lines.push('='.repeat(W));
  // No. Antrian — HANYA di NOTA DAPUR (kasir tidak pakai antrian).
  // Mode DOUBLE HEIGHT saja (ESC ! 0x10 / byte 0x1B 0x21 0x10):
  // font meregang lonjong ke bawah (tinggi dobel, lebar normal) — beda dari font menu.
  // Setelah baris antrian, reset font ke normal (ESC ! 0x00 / byte 0x1B 0x21 0x00).
  if (type === 'dapur') {
    const ESC = '\u001B';
    const TALL = ESC + '!' + '\u0010';   // ESC ! 0x10 = Select Print Mode: Double-Height only
    const NORMAL = ESC + '!' + '\u0000'; // ESC ! 0x00 = reset font ke normal
    const queueStr = 'No. Antrian: ' + (receipt.queueNumber || 1);
    const queuePad = Math.max(0, Math.floor((W - queueStr.length) / 2));
    lines.push(TALL + ' '.repeat(queuePad) + queueStr + NORMAL);
  }
  lines.push('');

  if (type !== 'dapur') {
    lines.push('');
    if (resto.footerText) {
      // Word-wrap (bukan char-wrap) supaya kata tidak terpotong di tengah
      const words = resto.footerText.split(' ');
      let line = '';
      const lines2 = [];
      words.forEach(word => {
        if ((line + ' ' + word).trim().length > (W - 2)) {
          if (line) lines2.push(line.trim());
          line = word;
        } else {
          line = (line + ' ' + word).trim();
        }
      });
      if (line) lines2.push(line.trim());
      lines2.forEach(l => lines.push(center(l)));
    } else {
      lines.push(center('Terimakasih atas kunjungan Anda'));
    }
    if (resto.promoText) lines.push(center(resto.promoText));
  }
  lines.push('');
  lines.push('');
  return lines.join('\n');
}

// Cache device objects globally untuk auto-print (no re-select needed)
const _printerDeviceCache = {};

async function printReceipt(receipt, printerType) {
  const printers = getPrinters();
  const saved = printers[printerType];
  // Strip escape chars untuk display manual
  const stripEsc = stripEscForPreview;
  if (!saved) {
    alert('Printer ' + (printerType === 'dapur' ? 'Dapur' : 'Kasir/Struk') + ' belum dipilih.\n\nBuka menu Pengaturan → Printer Bluetooth untuk memilih printer terlebih dahulu.');
    return;
  }
  if (!navigator.bluetooth) {
    alert('Browser tidak mendukung Web Bluetooth API.\nGunakan Chrome/Edge di Android atau desktop dengan HTTPS.\n\nAtau salin nota manual:');
    prompt('Isi nota (' + printerType + '):', stripEsc(formatReceiptESCPOS(receipt, printerType)));
    return;
  }
  try {
    let device = _printerDeviceCache[printerType];
    // Jika device sudah di-cache dan masih connected, langsung print
    if (device && device.gatt && device.gatt.connected) {
      const text = formatReceiptESCPOS(receipt, printerType);
      await printText(device, text);
      return; // Sukses, tidak perlu alert (cepat)
    }
    // Jika device di-cache tapi disconnected, coba reconnect
    if (device) {
      try {
        const text = formatReceiptESCPOS(receipt, printerType);
        await printText(device, text);
        return;
      } catch(e) {
        // Reconnect gagal, fallback ke requestDevice
        _printerDeviceCache[printerType] = null;
      }
    }
    // First time atau reconnect gagal — pilih device
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: saved.name }],
      optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '00001101-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455']
    }).catch(() => null);
    if (!device) return;
    _printerDeviceCache[printerType] = device; // Cache untuk next print
    const text = formatReceiptESCPOS(receipt, printerType);
    await printText(device, text);
    // Silent success (tidak alert kalau sukses, biar cepat)
  } catch (e) {
    _printerDeviceCache[printerType] = null; // Clear cache kalau gagal
    alert('Gagal print: ' + e.message + '\n\nNota bisa disalin manual:');
    prompt('Isi nota (' + printerType + '):', stripEsc(formatReceiptESCPOS(receipt, printerType)));
  }
}

function useFullscreenPref() {
  const [on, setOn] = React.useState(function() { try { return localStorage.getItem('miapos-fullscreen') === '1'; } catch(e) { return false; } });
  function enable() {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn) { try { var r = fn.call(el); if (r && r.catch) r.catch(function(){}); } catch(e) {} }
  }
  function toggle() {
    var next = !on;
    setOn(next);
    try { localStorage.setItem('miapos-fullscreen', next ? '1' : '0'); } catch(e) {}
    if (next) enable();
    else { try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch(e) {} }
  }
  return [on, toggle];
}

// ===== SERVER BRIDGE (Python + C++ Native Engine) =====
// Kalau dibuka lewat server Termux (python main.py), app otomatis
// deteksi API lokal. Kalau dibuka sebagai HTML murni, semua fitur
// tetap jalan normal — kartu engine hanya tidak tampil.
// v2.7: di Vercel ada API CLOUD → backup otomatis tersimpan ke
// folder backups/ di repo GitHub — TANPA Termux & tanpa jaga server.
var CloudStore = {
  KEY_NAME: 'miapos-cloud-key',
  getKey: function() { try { return localStorage.getItem(this.KEY_NAME) || ''; } catch (e) { return ''; } },
  setKey: function(k) { try { if (k) localStorage.setItem(this.KEY_NAME, k); else localStorage.removeItem(this.KEY_NAME); } catch (e) {} }
};
var ServerBridge = {
  _ping: null,
  isHttp: function() { return location.protocol === 'http:' || location.protocol === 'https:'; },
  ping: function() {
    if (this._ping) return this._ping;
    if (!this.isHttp()) { this._ping = Promise.resolve(null); return this._ping; }
    this._ping = fetch('/api/ping', { cache: 'no-store' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .catch(function() { return null; });
    return this._ping;
  },
  keyHeaders: function() { var k = CloudStore.getKey(); return k ? { 'x-backup-key': k } : {}; },
  backup: function(data) {
    return fetch('/api/backup', {
      method:'POST',
      headers: Object.assign({ 'Content-Type':'application/json' }, this.keyHeaders()),
      body: JSON.stringify(data)
    }).then(function(r) { return r.json(); });
  },
  listBackups: function() {
    // Cloud (Vercel): GET /api/backup · Termux: GET /api/backups
    var cloud = fetch('/api/backup', { cache:'no-store', headers: this.keyHeaders() })
      .then(function(r) { return r.json().catch(function() { return null; }); })
      .catch(function() { return null; });
    var lokal = fetch('/api/backups', { cache:'no-store' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .catch(function() { return null; });
    return cloud.then(function(c) {
      // jawaban cloud dipakai walau error key (supaya app bisa bilang "PASSWORD SALAH")
      if (c && (c.ok || c.error)) return c;
      return lokal;
    });
  },
  readBackup: function(file) {
    // Cloud: baca via API · Termux: file statis /backups/<nama>
    return fetch('/api/backup?file=' + encodeURIComponent(file), { cache:'no-store', headers: this.keyHeaders() })
      .then(function(r) {
        if (r.ok) return r.json();
        return fetch('/backups/' + file).then(function(r2) { return r2.ok ? r2.json() : null; });
      })
      .catch(function() { return null; });
  },
  stats: function(daily) {
    return fetch('/api/stats', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ daily: daily }) })
      .then(function(r) { return r.ok ? r.json() : null; })
      .catch(function() { return null; });
  }
};

<script>
/* ===== MIAPOS AUTO-UPDATE (Service Worker) =====
   - Aktif hanya di https (Vercel) / localhost: tiap aplikasi dibuka, versi terbaru otomatis diambil.
   - file:// (Termux/offline) otomatis dilewati → tetap 100% offline, tanpa error.
   - Ada versi baru? Aplikasi reload sendiri. Cukup timpa file di GitHub → semua pengguna ke-update. */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var ok = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!ok) return;
  var refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (refreshing) return;
    refreshing = true;
    try { window.location.reload(); } catch (e) {}
  });
  window.addEventListener('load', function () {
    // v2.9: sekalian daftarkan Background Sync + Periodic Sync (checklist PWABuilder).
    // Semua dibungkus try/catch — browser yang gak dukung tetap aman, app tetap jalan.
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function (reg) {
      try { if (reg.sync && reg.sync.register) reg.sync.register('miapos-sync').catch(function () {}); } catch (e) {}
      try {
        if (reg.periodicSync && reg.periodicSync.register) {
          reg.periodicSync.register('miapos-periodic', { minInterval: 12 * 60 * 60 * 1000 }).catch(function () {});
        }
      } catch (e) {}
    }).catch(function () {});
  });
})();
</script>
